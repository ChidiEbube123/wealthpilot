<form method="post">
  {% csrf_token %}
    <label>Name:</label>

    <input type="text" name="name" placeholder="name">

  <label>Tickers:</label>

  <input type="text" name="tickers" placeholder="e.g. VTI TLT IEI GLD DBC">
   <label>Risk bucket:</label>

  <input type="number" name="risk_bucket" placeholder="e.g. VTI TLT IEI GLD DBC">
  <label>Expected Return:</label>
  <input type="number" name="expected_return" step="0.001">
  <button type="submit">Generate Portfolio</button>
</form>
